<!-- Visitor map (mapmyvisitors), drawn as a dot matrix like caozhijun.top (see
     .visitor-map in _redesign.scss). Colors are URL parameters: co = ocean (must be
     the page color, --bg), cl = land (the color of the dots), ct = text; t=n hides
     the counters. The widget reads this box's width once, on load. -->
<div class="visitor-map" id="visitors">
  <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=q8iQFGcCi19XOe-IIeDmfK_O8g-uRn0Tm94Z_Vu4-ZY&cl=c5cfda&co=f3f6f9&ct=7b8794&t=n&w=a"></script>
</div>
