<!-- Visitor map: land dots (images/visitor-map.svg) and a marker per place the
     visitors came from, drawn by site.js from the site's own counter (worker/,
     served at /api/visitors). Hidden until the data arrives. -->
<div class="visitor-map" id="visitor-map" role="img" aria-label="Visitor map" hidden>
  <img src="images/visitor-map.svg" alt="" width="900" height="409">
  <svg viewBox="0 0 900 409" aria-hidden="true"></svg>
  <span class="visitor-map__tip" hidden></span>
</div>
