<!-- Visitor map (mapmyvisitors). Colors are URL parameters: co = ocean (the page
     background, so the map blends in), cl = land, ct = text; t=n hides the counters.
     The widget reads this box's width once, on load. -->
<div class="visitor-map" id="visitors">
  <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=q8iQFGcCi19XOe-IIeDmfK_O8g-uRn0Tm94Z_Vu4-ZY&cl=d3dbe3&co=f3f6f9&ct=7b8794&t=n&w=a"></script>

  <!-- Total views / visitors from busuanzi (不蒜子), counted per site. site.js reveals
       the block once busuanzi has filled in the numbers. -->
  <div class="site-stats" hidden>
    <div class="stat"><span class="n" id="busuanzi_value_site_pv"></span><span class="l">Total Views</span></div>
    <div class="stat"><span class="n" id="busuanzi_value_site_uv"></span><span class="l">Visitors</span></div>
  </div>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</div>
